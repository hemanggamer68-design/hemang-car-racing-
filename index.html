<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Hemang BR Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #e8e8f0;
            touch-action: none !important;
            position: fixed;
        }
        #game-container {
            width: 100vw !important;
            height: 100vh !important;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
            touch-action: none !important;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameCanvas {
            position: absolute;
            inset: 0;
            width: 100vw !important;
            height: 100vh !important;
            display: block;
            z-index: 1;
            touch-action: none !important;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none !important;
        }
        #rotateMsg {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: #000;
            color: #fff;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            font-size: 18px;
        }
        #rotateMsg svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            fill: #FF1E27;
        }
        @media (orientation: portrait) {
            #rotateMsg {
                display: flex;
            }
            #game-container {
                display: none !important;
            }
        }
        .screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .screen.active {
            display: flex;
        }
        #splash {
            background: #000000;
            z-index: 100;
        }
        .logo-wrap {
            text-align: center;
            margin-bottom: 48px;
            opacity: 0;
            animation: fadeIn 1.8s ease-out forwards;
        }
        .logo {
            font-size: clamp(42px, 12vw, 72px);
            font-weight: 900;
            letter-spacing: .18em;
            color: #FF1E27;
            text-shadow: 0 0 15px rgba(255, 30, 39, .6);
        }
        .logo-sub {
            font-size: 13px;
            letter-spacing: .45em;
            color: #888;
            margin-top: 10px;
            text-transform: uppercase;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .loader-bar {
            width: min(280px, 70vw);
            height: 6px;
            background: #1a1a1a;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 28px;
        }
        .loader-fill {
            height: 100%;
            width: 0%;
            background: #FF1E27;
            border-radius: 3px;
            transition: width .25s ease;
        }
        .loader-pct {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            letter-spacing: .1em;
        }
        #lobby {
            background: transparent;
            pointer-events: none;
        }
        #lobby * {
            pointer-events: auto;
        }
        .lobby-ui {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            pointer-events: none;
        }
        .lobby-ui>* {
            pointer-events: auto;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, rgba(0, 0, 0, .55), transparent);
        }
        .profile-chip {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, .12);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 24px;
            padding: 6px 14px 6px 6px;
            backdrop-filter: blur(8px);
        }
        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: #111;
        }
        .profile-info {
            font-size: 13px;
            line-height: 1.25;
            color: #fff;
        }
        .profile-info span {
            display: block;
            color: rgba(255, 255, 255, .7);
            font-size: 11px;
        }
        .currency {
            display: flex;
            gap: 12px;
            font-size: 13px;
            font-weight: 600;
        }
        .currency span {
            background: rgba(0, 0, 0, .45);
            padding: 6px 12px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, .15);
            color: #fff;
        }
        .side-nav {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 8px;
        }
        .nav-btn {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .18);
            color: #fff;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            cursor: pointer;
            transition: all .2s;
            backdrop-filter: blur(6px);
        }
        .nav-btn:active,
        .nav-btn.active {
            background: rgba(255, 30, 39, .25);
            border-color: #FF1E27;
            color: #FF1E27;
            transform: scale(.95);
        }
        .nav-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }
        .bottom-bar {
            margin-top: auto;
            padding: 18px;
            display: flex;
            justify-content: center;
            gap: 14px;
            background: linear-gradient(0deg, rgba(0, 0, 0, .6), transparent);
        }
        .mode-btn {
            flex: 1;
            max-width: 210px;
            padding: 16px 14px;
            border-radius: 16px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .04em;
            cursor: pointer;
            transition: transform .15s;
        }
        .mode-btn:active {
            transform: scale(.96);
        }
        .mode-primary {
            background: linear-gradient(135deg, #FF1E27, #ff4d57);
            color: #fff;
            box-shadow: 0 4px 20px rgba(255, 30, 39, .45);
        }
        .mode-secondary {
            background: rgba(0, 0, 0, .55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .2);
        }
        .panel {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, .88);
            backdrop-filter: blur(14px);
            display: none;
            flex-direction: column;
            padding: 24px 18px;
            overflow-y: auto;
            z-index: 20;
        }
        .panel.active {
            display: flex;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }
        .panel-header h2 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: .06em;
            color: #fff;
        }
        .close-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 14px;
        }
        .item-card {
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 14px;
            padding: 14px 10px;
            text-align: center;
            cursor: pointer;
            transition: all .2s;
        }
        .item-card:active {
            transform: scale(.96);
        }
        .item-card.equipped {
            border-color: #FF1E27;
            box-shadow: 0 0 18px rgba(255, 30, 39, .35);
        }
        .item-card .icon {
            font-size: 30px;
            margin-bottom: 8px;
            display: block;
        }
        .item-card .name {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .item-card .rarity {
            font-size: 11px;
            color: #aaa;
            margin-top: 3px;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }
        .tab {
            padding: 9px 18px;
            border-radius: 22px;
            background: rgba(255, 255, 255, .08);
            border: none;
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
        }
        .tab.active {
            background: rgba(255, 30, 39, .25);
            color: #FF1E27;
        }
        #loading {
            background: #000;
            z-index: 50;
        }
        .load-title {
            font-size: 18px;
            letter-spacing: .2em;
            margin-bottom: 24px;
            color: #FF1E27;
        }
        .load-bar {
            width: min(300px, 80vw);
            height: 8px;
            background: #222;
            border-radius: 4px;
            overflow: hidden;
        }
        .load-fill {
            height: 100%;
            width: 0%;
            background: #FF1E27;
            transition: width .3s;
        }
        .load-tip {
            font-size: 12px;
            color: #777;
            margin-top: 16px;
            max-width: 280px;
            text-align: center;
        }
        #hud {
            position: fixed;
            inset: 0;
            z-index: 30;
            pointer-events: none;
            display: none;
        }
        #hud.active {
            display: block;
        }
        #hud * {
            pointer-events: auto;
        }
        .health-bar-wrap {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: min(220px, 55vw);
            height: 18px;
            background: rgba(0, 0, 0, .55);
            border-radius: 9px;
            border: 1px solid rgba(255, 255, 255, .15);
            overflow: hidden;
        }
        .health-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #22c55e, #16a34a);
            transition: width .2s;
        }
        .ammo-counter {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, .55);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, .12);
        }
        .ammo-counter span {
            color: #FF1E27;
        }
        .minimap {
            position: absolute;
            top: 52px;
            right: 16px;
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, .5);
            border: 1px solid rgba(255, 30, 39, .4);
            border-radius: 8px;
            overflow: hidden;
        }
        .minimap canvas {
            width: 100%;
            height: 100%;
        }
        .joystick-zone {
            position: absolute;
            bottom: 24px;
            left: 16px;
            width: 140px;
            height: 140px;
        }
        .joystick-base {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
            border: 2px solid rgba(255, 255, 255, .2);
            position: relative;
            margin: 15px;
        }
        .joystick-knob {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(255, 30, 39, .55);
            border: 2px solid #FF1E27;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .action-btns {
            position: absolute;
            bottom: 24px;
            right: 16px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
        }
        .action-row {
            display: flex;
            gap: 12px;
        }
        .act-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, .25);
            background: rgba(0, 0, 0, .55);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform .1s;
        }
        .act-btn:active {
            transform: scale(.9);
            background: rgba(255, 30, 39, .4);
            border-color: #FF1E27;
        }
        .act-btn.fire {
            width: 76px;
            height: 76px;
            background: rgba(255, 30, 39, .45);
            border-color: #FF1E27;
            font-size: 13px;
        }
        .act-btn.jump {
            width: 56px;
            height: 56px;
        }
        .cam-toggle {
            position: absolute;
            top: 16px;
            left: 16px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, .55);
            border: 1px solid rgba(255, 255, 255, .15);
            color: #e0e0f0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            z-index: 35;
        }
        .kill-feed {
            position: absolute;
            top: 100px;
            left: 16px;
            font-size: 12px;
            color: #ff6b9d;
            text-shadow: 0 1px 3px #000;
        }
        .crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 18px;
            height: 18px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
        }
        .crosshair::before,
        .crosshair::after {
            content: '';
            position: absolute;
            background: #FF1E27;
        }
        .crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        .crosshair::after {
            height: 2px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }
        .fps-mode .crosshair {
            display: block;
        }
        .toast {
            position: fixed;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, .85);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            z-index: 200;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            color: #fff;
        }
        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="rotateMsg">
        <svg viewBox="0 0 24 24"><path d="M16.48 2.52c3.27 1.55 5.61 4.72 5.97 8.48h1.5C23.44 4.84 18.29 0 12 0l-.66.03 3.81 3.81 1.33-1.32zm-6.25-.77c-.59-.59-1.54-.59-2.12 0L1.75 8.11c-.59.59-.59 1.54 0 2.12l12.02 12.02c.59.59 1.54.59 2.12 0l6.36-6.36c.59-.59.59-1.54 0-2.12L10.23 1.75zm4.6 19.44L2.81 9.17l6.36-6.36 12.02 12.02-6.36 6.36zm-7.23.43C2.76 20.3.45 17.11.1 13.34H-1.4C-.94 19.16 4.21 24 10.5 24l.66-.03-3.81-3.81-1.33 1.32z"/></svg>
        <div>Please rotate your device<br>to Landscape mode</div>
    </div>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="splash" class="screen active">
            <div class="logo-wrap">
                <div class="logo">HEMANG</div>
                <div class="logo-sub">Battle Royale Engine</div>
            </div>
            <div class="loader-bar"><div class="loader-fill" id="splashFill"></div></div>
            <div class="loader-pct" id="splashPct">0%</div>
        </div>
        <div id="lobby" class="screen">
            <div class="lobby-ui">
                <div class="top-bar">
                    <div class="profile-chip">
                        <div class="avatar">H</div>
                        <div class="profile-info">Hemang<span>Lv.12 • Solo</span></div>
                    </div>
                    <div class="currency"><span>💎 2,450</span><span>🪙 18.2k</span></div>
                </div>
                <div class="side-nav">
                    <button class="nav-btn active" data-panel="none"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Home</button>
                    <button class="nav-btn" data-panel="collections"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>Coll</button>
                    <button class="nav-btn" data-panel="shop"><svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0020 4H5.21l-.94-2H1zm16 16c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>Shop</button>
                    <button class="nav-btn" data-panel="modes"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>Modes</button>
                    <button class="nav-btn" data-panel="events"><svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>Events</button>
                </div>
                <div class="bottom-bar">
                    <button class="mode-btn mode-secondary" id="btnSettings">SETTINGS</button>
                    <button class="mode-btn mode-primary" id="btnTraining">TRAINING GROUNDS</button>
                </div>
            </div>
            <div class="panel" id="panel-collections">
                <div class="panel-header"><h2>COLLECTIONS</h2><button class="close-btn" data-close>×</button></div>
                <div class="tabs"><button class="tab active" data-tab="guns">Guns</button><button class="tab" data-tab="outfits">Outfits</button></div>
                <div class="grid" id="gunsGrid"></div>
                <div class="grid" id="outfitsGrid" style="display:none"></div>
            </div>
            <div class="panel" id="panel-shop">
                <div class="panel-header"><h2>SHOP</h2><button class="close-btn" data-close>×</button></div>
                <div class="grid" id="shopGrid"></div>
            </div>
            <div class="panel" id="panel-modes">
                <div class="panel-header"><h2>GAME MODES</h2><button class="close-btn" data-close>×</button></div>
                <div style="display:flex;flex-direction:column;gap:14px">
                    <button class="mode-btn mode-primary" style="max-width:100%" id="btnSolo">SOLO — Training</button>
                    <button class="mode-btn mode-secondary" style="max-width:100%" disabled>DUO — Coming Soon</button>
                    <button class="mode-btn mode-secondary" style="max-width:100%" disabled>SQUAD — Coming Soon</button>
                </div>
            </div>
            <div class="panel" id="panel-events">
                <div class="panel-header"><h2>EVENTS</h2><button class="close-btn" data-close>×</button></div>
                <p style="color:#aaa;font-size:14px;line-height:1.6">No active events. Check back soon for limited-time challenges and rewards.</p>
            </div>
        </div>
        <div id="loading" class="screen">
            <div class="load-title">ENTERING BATTLEFIELD</div>
            <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
            <div class="load-tip" id="loadTip">Spawning AI bots…</div>
        </div>
        <div id="hud">
            <button class="cam-toggle" id="btnCam">TPV</button>
            <div class="health-bar-wrap"><div class="health-fill" id="healthFill"></div></div>
            <div class="ammo-counter"><span id="ammoVal">30</span> / 90</div>
            <div class="minimap"><canvas id="miniCanvas" width="80" height="80"></canvas></div>
            <div class="kill-feed" id="killFeed"></div>
            <div class="crosshair"></div>
            <div class="joystick-zone" id="joyZone">
                <div class="joystick-base" id="joyBase"><div class="joystick-knob" id="joyKnob"></div></div>
            </div>
            <div class="action-btns">
                <div class="action-row">
                    <button class="act-btn" id="btnScope">SCOPE</button>
                    <button class="act-btn" id="btnReload">RELOAD</button>
                </div>
                <div class="action-row">
                    <button class="act-btn jump" id="btnJump">JUMP</button>
                    <button class="act-btn fire" id="btnFire">FIRE</button>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script type="importmap">

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const STATE = { SPLASH: 0, LOBBY: 1, LOADING: 2, GAME: 3 };
        let appState = STATE.SPLASH;
        const canvas = document.getElementById('gameCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance',
            alpha: false });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        const clock = new THREE.Clock();

        function forceLandscape() {
            try {
                const el = document.documentElement;

            _setupJoystick() {
                const zone = document.getElementById('joyZone');
                const base = document.getElementById('joyBase');
                const knob = document.getElementById('joyKnob');
                let active = false;
                let origin = { x: 0, y: 0 };
                const maxR = 42;
                const onStart = (e) => {
                    e.preventDefault();
                    const t = e.changedTouches ? e.changedTouches[0] : e;
                    const rect = base.getBoundingClientRect();
                    origin.x = rect.left + rect.width / 2;
                    origin.y = rect.top + rect.height / 2;
                    active = true;
                    move(t.clientX, t.clientY);
                };
                const move = (cx, cy) => {
                    if (!active) return;
                    let dx = cx - origin.x,
                        dy = cy - origin.y;
                    const len = Math.sqrt(dx * dx + dy * dy);
                    if (len > maxR) { dx = (dx / len) * maxR;
                        dy = (dy / len) * maxR; }
                    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    this.moveInput.x = dx / maxR;
                    this.moveInput.y = -dy / maxR;
                };
                const onMove = (e) => {
                    e.preventDefault();
                    const t = e.changedTouches ? e.changedTouches[0] : e;
                    move(t.clientX, t.clientY);
                };
                const onEnd = (e) => {
                    if (e) e.preventDefault();
                    active = false;
                    knob.style.transform = 'translate(-50%, -50%)';
                    this.moveInput.x = 0;
                    this.moveInput.y = 0;
                };
                zone.addEventListener('touchstart', onStart, { passive: false });
                zone.addEventListener('touchmove', onMove, { passive: false });
                zone.addEventListener('touchend', onEnd, { passive: false });
                zone.addEventListener('touchcancel', onEnd, { passive: false });
                zone.addEventListener('mousedown', onStart);
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onEnd);
            }
            // PURE TOUCH CAMERA ROTATION - NO GYROSCOPE
            _setupTouchRotation() {
                let touchStartX = 0;
                let touchStartY = 0;
                let isRotating = false;
                const SENSITIVITY = 0.003;

                const isInUI = (x, y) => {
                    const joyZone = document.getElementById('joyZone');
                    const r1 = joyZone.getBoundingClientRect();
                    if (x >= r1.left && x <= r1.right && y >= r1.top && y <= r1.bottom) return true;
                    const actions = document.querySelector('.action-btns');
                    const r2 = actions.getBoundingClientRect();
                    if (x >= r2.left && x <= r2.right && y >= r2.top && y <= r2.bottom) return true;
                    const camToggle = document.getElementById('btnCam');
                    const r3 = camToggle.getBoundingClientRect();
                    if (x >= r3.left && x <= r3.right && y >= r3.top && y <= r3.bottom) return true;
                    return false;
                };

                window.addEventListener('touchstart', (e) => {
                    for (let t of e.changedTouches) {
                        if (t.clientX > window.innerWidth / 2 && !isInUI(t.clientX, t.clientY)) {
                            isRotating = true;
                            touchStartX = t.clientX;
                            touchStartY = t.clientY;
                        }
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    for (let t of e.changedTouches) {
                        if (t.clientX > window.innerWidth / 2 && isRotating) {
                            e.preventDefault();
                            const deltaX = t.clientX - touchStartX;
                            const deltaY = t.clientY - touchStartY;

                            this.cameraYaw -= deltaX * SENSITIVITY;
                            this.cameraPitch -= deltaY * SENSITIVITY;
                            this.cameraPitch = Math.max(-1.2, Math.min(1.2, this.cameraPitch));

                            touchStartX = t.clientX;
                            touchStartY = t.clientY;
                        }
                    }
                }, { passive: false });

                window.addEventListener('touchend', () => { isRotating = false; });
                window.addEventListener('touchcancel', () => { isRotating = false; });
            }
            _setupButtons() {
                const fireBtn = document.getElementById('btnFire');
                fireBtn.addEventListener('touchstart', (e) => { e.preventDefault();
                    this.fireHeld = true; }, { passive: false });
                fireBtn.addEventListener('touchend', (e) => { e.preventDefault();
                    this.fireHeld = false; }, { passive: false });
                fireBtn.addEventListener('mousedown', () => { this.fireHeld = true; });
                fireBtn.addEventListener('mouseup', () => { this.fireHeld = false; });
                document.getElementById('btnJump').addEventListener('click', () => this.jump());
                document.getElementById('btnReload').addEventListener('click', () => this.reload());
                document.getElementById('btnScope').addEventListener('click', () => this.toggleScope());
                document.getElementById('btnCam').addEventListener('click', () => this.toggleCamera());
            }
            jump() {
                if (this.onGround) { this.velocity.y = 7.8;
                    this.onGround = false; }
            }
            reload() {
                if (this.ammo >= 30 || this.reserve <= 0) return;
                const need = 30 - this.ammo;
                const take = Math.min(need, this.reserve);
                this.ammo += take;
                this.reserve -= take;
                document.getElementById('ammoVal').textContent = this.ammo;
                showToast('Reloaded — 30 rounds');
            }
            toggleScope() {
                this.isScoped = !this.isScoped;
                this.camera.fov = this.isScoped ? 35 : 75;
                this.camera.updateProjectionMatrix();
                showToast(this.isScoped ? 'Scoped In' : 'Scoped Out');
            }
            toggleCamera() {
                this.isFPS = !this.isFPS;
                document.getElementById('btnCam').textContent = this.isFPS ? 'FPS' : 'TPV';
                document.getElementById('hud').classList.toggle('fps-mode', this.isFPS);
                if (this.mesh) this.mesh.visible = !this.isFPS;
                if (!this.isScoped) { this.camera.fov = 75;
                    this.camera.updateProjectionMatrix(); }
            }
            takeDamage(amount) {
                this.health = Math.max(0, this.health - amount);
                document.getElementById('healthFill').style.width = this.health + '%';
                if (this.health <= 0) {
                    showToast('You were eliminated!');
                    setTimeout(() => {
                        this.health = 100;
                        document.getElementById('healthFill').style.width = '100%';
                        this.mesh.position.set(0, 0, 0);
                        this.velocity.set(0, 0, 0);
                    }, 2000);
                }
            }
            shoot(bots) {
                const now = performance.now() / 1000;
                if (now - this.lastShot < this.fireRate || this.ammo <= 0) return;
                this.lastShot = now;
                this.ammo--;
                document.getElementById('ammoVal').textContent = this.ammo;
                this.recoilKick = 0.08;
                const origin = new THREE.Vector3();
                this.gun.getWorldPosition(origin);
                origin.y += 0.05;
                const dir = new THREE.Vector3();
                this.camera.getWorldDirection(dir);
                if (!this.isFPS) { dir.y = 0;
                    dir.normalize(); }
                const end = origin.clone().add(dir.clone().multiplyScalar(55));
                const tracer = new THREE.Line(new THREE.BufferGeometry().setFromPoints([origin, end]), new THREE
                    .LineBasicMaterial({ color: 0xffee55, transparent: true, opacity: 0.95 }));
                this.scene.add(tracer);
                setTimeout(() => this.scene.remove(tracer), 55);
                this.raycaster.set(origin, dir);
                const meshes = [];
                bots.forEach(b => {
                    if (b.mesh) b.mesh.traverse(c => { if (c.isMesh) meshes.push(c); });
                });
                const hits = this.raycaster.intersectObjects(meshes, false);
                if (hits.length > 0) {
                    const hitObj = hits[0].object;
                    let bot = null;
                    for (const b of bots) {
                        let found = false;
                        b.mesh.traverse(c => { if (c === hitObj) found = true; });
                        if (found) { bot = b; break; }
                    }
                    if (bot) {
                        bot.takeDamage(28);
                        const spark = new THREE.Mesh(new THREE.SphereGeometry(0.1, 6, 6), new THREE
                            .MeshBasicMaterial({ color: 0xffaa00 }));
                        spark.position.copy(hits[0].point);
                        this.scene.add(spark);
                        setTimeout(() => this.scene.remove(spark), 100);
                    }
                }
            }
            update(dt, bots, bounds) {
                // Movement using joystick input
                let dirX = this.moveInput.x;
                let dirY = this.moveInput.y;
                if (Math.abs(dirX) > 0.05 || Math.abs(dirY) > 0.05) {
                    const moveSpeed = 0.15;
                    let moveDir = new THREE.Vector3();
                    this.camera.getWorldDirection(moveDir);
                    moveDir.y = 0;
                    moveDir.normalize();
                    let rightDir = new THREE.Vector3();
                    rightDir.crossVectors(moveDir, new THREE.Vector3(0, 1, 0)).normalize();
                    this.mesh.position.addScaledVector(moveDir, dirY * moveSpeed);
                    this.mesh.position.addScaledVector(rightDir, dirX * moveSpeed);
                    const moveDirection = new THREE.Vector3();
                    moveDirection.addScaledVector(moveDir, dirY);
                    moveDirection.addScaledVector(rightDir, dirX);
                    moveDirection.y = 0;
                    if (moveDirection.length() > 0.01) {
                        moveDirection.normalize();
                        const targetYaw = Math.atan2(moveDirection.x, moveDirection.z);
                        this.playerYaw = targetYaw;
                        this.mesh.rotation.y = targetYaw;
                    }
                }
                // Gravity
                this.velocity.y -= 19 * dt;
                this.mesh.position.y += this.velocity.y * dt;
                if (this.mesh.position.y <= 0) {
                    this.mesh.position.y = 0;
                    this.velocity.y = 0;
                    this.onGround = true;
                }
                const lim = bounds || 48;
                this.mesh.position.x = THREE.MathUtils.clamp(this.mesh.position.x, -lim, lim);
                this.mesh.position.z = THREE.MathUtils.clamp(this.mesh.position.z, -lim, lim);
                this.recoilKick *= 0.85;
                // Camera positioning
                if (this.isFPS) {
                    this.camera.position.copy(this.mesh.position).add(new THREE.Vector3(0, 1.65, 0));
                    const look = new THREE.Vector3(0, 0, -1);
                    look.applyAxisAngle(new THREE.Vector3(1, 0, 0), this.cameraPitch + this.recoilKick);
                    look.applyAxisAngle(new THREE.Vector3(0, 1, 0), this.cameraYaw);
                    this.camera.lookAt(this.camera.position.clone().add(look));
                } else {
                    const camDist = 5.2;
                    const camHeight = 2.2;
                    const camX = this.mesh.position.x + camDist * Math.sin(this.cameraYaw) * Math.cos(this.cameraPitch);
                    let camY = this.mesh.position.y + camHeight + camDist * Math.sin(this.cameraPitch);
                    const camZ = this.mesh.position.z + camDist * Math.cos(this.cameraYaw) * Math.cos(this.cameraPitch);
                    if (camY < 0.5) camY = 0.5;
                    this.camera.position.set(camX, camY, camZ);
                    this.camera.lookAt(this.mesh.position.clone().add(this.lookAtOffset));
                }
                if (this.fireHeld) this.shoot(bots);
            }
        }

        class Bot {
            constructor(scene, x, z) {
                this.scene = scene;
                this.health = 100;
                this.state = 'wander';
                this.speed = 3.3;
                this.detectRange = 30;
                this.shootRange = 19;
                this.lastShot = 0;
                this.wanderTimer = 0;
                this.wanderDir = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
                this.dead = false;
                this.hitFlash = 0;
                this.originalMats = [];
                this._createMesh(x, z);
            }
            _createMesh(x, z) {
                const group = new THREE.Group();
                const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.34, 0.9, 5, 10), new THREE
                    .MeshStandardMaterial({ color: 0x8b2020, metalness: 0.3, roughness: 0.55 }));
                body.position.y = 1.15;
                body.castShadow = true;
                group.add(body);
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.23, 12, 12), new THREE
                    .MeshStandardMaterial({ color: 0xc08070 }));
                head.position.y = 1.8;
                group.add(head);
                const hair = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.1, 0.36), new THREE
                    .MeshStandardMaterial({ color: 0x111111 }));
                hair.position.y = 0.15;
                head.add(hair);
                group.position.set(x, 0, z);
                this.mesh = group;
                this.scene.add(group);
                this.mesh.traverse(c => {
                    if (c.isMesh && c.material) this.originalMats.push({ mesh: c, color: c.material.color.clone() });
                });
            }
            takeDamage(dmg) {
                if (this.dead) return;
                this.health -= dmg;
                this.hitFlash = 0.25;
                this.mesh.traverse(c => {
                    if (c.isMesh && c.material) c.material.color.setHex(0xff2222);
                });
                if (this.health <= 0) {
                    this.dead = true;
                    this.scene.remove(this.mesh);
                    showToast('Bot eliminated');
                    document.getElementById('killFeed').textContent = 'You eliminated a bot';
                    setTimeout(() => { document.getElementById('killFeed').textContent = ''; }, 2200);
                }
            }
            update(dt, player) {
                if (this.dead) return;
                if (this.hitFlash > 0) {
                    this.hitFlash -= dt;
                    if (this.hitFlash <= 0) this.originalMats.forEach(o => o.mesh.material.color.copy(o.color));
                }
                const pos = this.mesh.position,
                    pPos = player.mesh.position,
                    dist = pos.distanceTo(pPos);
                if (dist < this.detectRange) this.state = dist < this.shootRange ? 'shoot' : 'chase';
                else this.state = 'wander';
                if (this.state === 'wander') {
                    this.wanderTimer -= dt;
                    if (this.wanderTimer <= 0) {
                        this.wanderDir.set(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
                        this.wanderTimer = 2 + Math.random() * 3;
                    }
                    pos.x += this.wanderDir.x * this.speed * 0.55 * dt;
                    pos.z += this.wanderDir.z * this.speed * 0.55 * dt;
                    this.mesh.rotation.y = Math.atan2(-this.wanderDir.x, -this.wanderDir.z);
                } else if (this.state === 'chase') {
                    const dir = pPos.clone().sub(pos).setY(0).normalize();
                    pos.x += dir.x * this.speed * dt;
                    pos.z += dir.z * this.speed * dt;
                    this.mesh.rotation.y = Math.atan2(-dir.x, -dir.z);
                } else if (this.state === 'shoot') {
                    const dir = pPos.clone().sub(pos).setY(0).normalize();
                    this.mesh.rotation.y = Math.atan2(-dir.x, -dir.z);
                    const now = performance.now() / 1000;
                    if (now - this.lastShot > 0.85) {
                        this.lastShot = now;
                        if (Math.random() < 0.32 && dist < this.shootRange) player.takeDamage(9);
                        const origin = pos.clone().add(new THREE.Vector3(0, 1.35, 0));
                        const end = pPos.clone().add(new THREE.Vector3(0, 1.25, 0));
                        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints([origin, end]), new THREE
                            .LineBasicMaterial({ color: 0xff3333, transparent: true, opacity: 0.75 }));
                        this.scene.add(line);
                        setTimeout(() => this.scene.remove(line), 45);
                    }
                }
                pos.x = THREE.MathUtils.clamp(pos.x, -48, 48);
                pos.z = THREE.MathUtils.clamp(pos.z, -48, 48);
            }
        }

        class BotManager {
            constructor(scene) {
                this.scene = scene;
                this.bots = [];
            }
            spawn(count = 7) {
                this.bots.forEach(b => { if (b.mesh) this.scene.remove(b.mesh); });
                this.bots = [];
                for (let i = 0; i < count; i++) {
                    const angle = (i / count) * Math.PI * 2;
                    const r = 16 + Math.random() * 22;
                    this.bots.push(new Bot(this.scene, Math.cos(angle) * r, Math.sin(angle) * r));
                }
            }
            update(dt, player) {
                this.bots = this.bots.filter(b => !b.dead);
                this.bots.forEach(b => b.update(dt, player));
            }
            getAlive() { return this.bots.filter(b => !b.dead); }
        }

        class GameScene {
            constructor() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x87b8e0);
                this.scene.fog = new THREE.Fog(0x87b8e0, 45, 130);
                this.camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.player = null;
                this.bots = null;
                this.miniCtx = document.getElementById('miniCanvas').getContext('2d');
                this._buildEnvironment();
                this._loadClockTower();
            }
            _buildEnvironment() {
                // Invisible boundary walls
                const wallMat = new THREE.MeshStandardMaterial({ color: 0x5a6a5a, transparent: true, opacity: 0.3 });
                const size = 50;
                [
                    [0, -size, 100, 1],
                    [0, size, 100, 1],
                    [-size, 0, 1, 100],
                    [size, 0, 1, 100]
                ].forEach(([x, z, w, d]) => {
                    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 3.5, d), wallMat);
                    m.position.set(x, 1.75, z);
                    this.scene.add(m);
                });
                // Lighting
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.5));
                const sun = new THREE.DirectionalLight(0xfff5e0, 1.4);
                sun.position.set(35, 55, 25);
                sun.castShadow = true;
                sun.shadow.mapSize.set(2048, 2048);
                sun.shadow.camera.near = 2;
                sun.shadow.camera.far = 160;
                sun.shadow.camera.left = -65;
                sun.shadow.camera.right = 65;
                sun.shadow.camera.top = 65;
                sun.shadow.camera.bottom = -65;
                this.scene.add(sun);
                this.scene.add(new THREE.HemisphereLight(0x87b8e0, 0x7ec850, 0.45));
                // Sky
                this.scene.add(new THREE.Mesh(new THREE.SphereGeometry(150, 24, 16), new THREE.MeshBasicMaterial({ color: 0x6ab0e0,
                    side: THREE.BackSide })));
            }
            _loadClockTower() {
                const loader = new GLTFLoader();
                const modelUrl = "https://github.com/hemanggamer68-design/hemang-car-racing-/raw/refs/heads/main/clock_tower_free_fire_model.glb";
                loader.load(
                    modelUrl,
                    (gltf) => {
                        const model = gltf.scene;
                        // Compute bounding box to scale and position
                        const box = new THREE.Box3().setFromObject(model);
                        const size = box.getSize(new THREE.Vector3());
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const targetMax = 70; // Fit within arena boundaries
                        const scaleFactor = targetMax / maxDim;
                        model.scale.setScalar(scaleFactor);

                        // Recompute after scaling
                        const box2 = new THREE.Box3().setFromObject(model);
                        const center = box2.getCenter(new THREE.Vector3());
                        // Center horizontally, place base at y=0
                        model.position.x -= center.x;
                        model.position.z -= center.z;
                        model.position.y -= box2.min.y;

                        // Enable shadows on all meshes
                        model.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                                if (child.material) {
                                    child.material.needsUpdate = true;
                                }
                            }
                        });

                        this.scene.add(model);
                        console.log("Clock Tower loaded and added to scene");
                    },
                    undefined,
                    (err) => {
                        console.error("Failed to load Clock Tower model:", err);
                        // Fallback: add a simple ground plane if model fails
                        const ground = new THREE.Mesh(
                            new THREE.PlaneGeometry(100, 100),
                            new THREE.MeshStandardMaterial({ color: 0x7ec850, roughness: 0.88, metalness: 0.04 })
                        );
                        ground.rotation.x = -Math.PI / 2;
                        ground.receiveShadow = true;
                        this.scene.add(ground);
                    }
                );
            }
            start() {
                this.player = new PlayerController(this.scene, this.camera);
                this.bots = new BotManager(this.scene);
                this.bots.spawn(7);
                document.getElementById('hud').classList.add('active');
                document.getElementById('healthFill').style.width = '100%';
                document.getElementById('ammoVal').textContent = '30';
            }
            update(dt) {
                if (!this.player) return;
                this.player.update(dt, this.bots.getAlive(), 48);
                this.bots.update(dt, this.player);
                this._drawMinimap();
            }
            _drawMinimap() {
                const ctx = this.miniCtx;
                ctx.fillStyle = 'rgba(20,40,20,0.85)';
                ctx.fillRect(0, 0, 80, 80);
                const scale = 80 / 100;
                const px = 40 + this.player.mesh.position.x * scale;
                const pz = 40 + this.player.mesh.position.z * scale;
                ctx.fillStyle = '#FF1E27';
                ctx.beginPath();
                ctx.arc(px, pz, 3.2, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ff3344';
                this.bots.getAlive().forEach(b => {
                    const bx = 40 + b.mesh.position.x * scale;
                    const bz = 40 + b.mesh.position.z * scale;
                    ctx.fillRect(bx - 2, bz - 2, 4, 4);
                });
            }
            render() { renderer.render(this.scene, this.camera); }
            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
            }
            dispose() { document.getElementById('hud').classList.remove('active'); }
        }

        const lobby = new LobbyManager();
        let game = null;

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._tid);
            t._tid = setTimeout(() => t.classList.remove('show'), 1700);
        }

        function setState(s) {
            appState = s;
            document.getElementById('splash').classList.toggle('active', s === STATE.SPLASH);
            document.getElementById('lobby').classList.toggle('active', s === STATE.LOBBY);
            document.getElementById('loading').classList.toggle('active', s === STATE.LOADING);
            if (s === STATE.LOBBY) lobby.enter();
            else lobby.exit();
            if (s !== STATE.GAME && game) { game.dispose();
                game = null; }
        }

        async function loadAssets() {
            const fill = document.getElementById('splashFill');
            const pct = document.getElementById('splashPct');
            for (let p = 0; p <= 100; p += 5) {
                fill.style.width = p + '%';
                pct.textContent = p + '%';
                await new Promise(r => setTimeout(r, 40));
            }
        }

        async function startMatch() {
            setState(STATE.LOADING);
            const fill = document.getElementById('loadFill');
            const tip = document.getElementById('loadTip');
            const tips = ['Spawning AI bots…', 'Building terrain…', 'Calibrating weapons…', 'Almost there…'];
            for (let i = 0; i <= 100; i += 5) {
                fill.style.width = i + '%';
                tip.textContent = tips[Math.min(3, Math.floor(i / 28))];
                await new Promise(r => setTimeout(r, 35));
            }
            game = new GameScene();
            game.start();
            setState(STATE.GAME);
        }

        function onResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (appState === STATE.LOBBY) lobby.onResize();
            if (appState === STATE.GAME && game) game.onResize();
        }
        window.addEventListener('resize', onResize);
        window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

        // FIX: Cap delta time to prevent freeze on frame drops
        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            if (appState === STATE.LOBBY) {
                lobby.update(delta);
                lobby.render();
            } else if (appState === STATE.GAME && game) {
                game.update(delta);
                game.render();
            } else {
                renderer.setClearColor(0x000000);
                renderer.clear();
            }
        }
        (async() => {
            await loadAssets();
            setState(STATE.LOBBY);
            animate();
        })();
    </script>
